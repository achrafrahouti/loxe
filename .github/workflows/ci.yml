name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: loxe.AppImage
          - os: macos-13
            artifact_name: loxe.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # libxml2-dev provides the XML validator the engine links against.
      #
      # The XCB packages are a packaging fix: Qt 6.5+ links its XCB platform
      # plugin against libxcb-cursor, which is not on the runner image, and
      # linuxdeploy-plugin-qt resolves every ELF dependency of libqxcb.so — so a
      # missing one fails with "Could not find dependency: libxcb-cursor.so.0".
      - name: Install build and XCB runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.6.*"
          cache: true

      - name: Configure (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          # Fetched explicitly rather than relying on it being bundled, so
          # "--output appimage" cannot fail for a missing plugin.
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          # --icon-file is required: loxe.desktop declares Icon=loxe, and
          # linuxdeploy refuses a desktop file whose icon is not deployed.
          # OUTPUT pins the artifact name, which otherwise gains an arch suffix
          # and no longer matches the upload step.
          OUTPUT=${{ matrix.artifact_name }} \
          QMAKE=$(which qmake6 || which qmake) \
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable build/src/loxe \
            --desktop-file packaging/linux/loxe.desktop \
            --icon-file packaging/linux/loxe.png \
            --plugin qt \
            --output appimage

      - name: Package (macOS DMG)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/src/loxe.app
          # TODO: codesign and notarise
          hdiutil create -volname loxe -srcfolder build/src/loxe.app -ov -format UDZO loxe.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          # Fail loudly: "warn" previously let a broken packaging step upload
          # an empty artifact while the job still went green.
          if-no-files-found: error
